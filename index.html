<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Fit Tool</title>
  <style>
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-width: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f7;
      color: #222;
      overflow-wrap: anywhere;
    }
    button, input, select { font: inherit; }
    .app {
      width: min(100%, 1100px);
      margin: 0 auto;
      padding: 24px max(16px, env(safe-area-inset-right)) max(48px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    }
    h1 { margin: 0 0 6px; font-size: clamp(28px, 6vw, 42px); }
    .description { margin: 0; color: #666; line-height: 1.55; }
    .privacy { margin: 10px 0 0; color: #2f6f4e; font-size: 14px; line-height: 1.55; }
    .drop-area {
      display: block;
      width: 100%;
      min-width: 0;
      margin-top: 24px;
      padding: 40px 20px;
      border: 2px dashed #999;
      border-radius: 18px;
      background: #fff;
      text-align: center;
      line-height: 1.7;
      cursor: pointer;
    }
    .drop-area.dragover { background: #eef4ff; border-color: #3367d6; }
    input[type="file"] { display: none; }
    .workspace { display: none; width: 100%; min-width: 0; margin-top: 20px; gap: 18px; grid-template-columns: minmax(0, 1fr); }
    .card { min-width: 0; background: #fff; border-radius: 18px; padding: 16px; box-shadow: 0 8px 26px rgba(0,0,0,.05); }
    .preview-card { min-width: 0; }
    .preview-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }
    .preview-heading h2 { margin: 0; font-size: 20px; }
    .crop-help { margin: 4px 0 0; color: #666; font-size: 13px; line-height: 1.5; }
    .preset-group {
      padding: 12px;
      border: 1px solid #dfe4ea;
      border-radius: 12px;
      background: #f7f9fb;
    }
    .preset-note { margin: 8px 0 0; color: #555; font-size: 12px; line-height: 1.55; }
    .preset-source { display: inline-block; margin-top: 5px; color: #245f9e; font-size: 12px; }
    .preset-source[hidden] { display: none; }
    .secondary {
      flex: 0 0 auto;
      min-height: 44px;
      border: 1px solid #ccd0d7;
      border-radius: 10px;
      padding: 8px 12px;
      background: #fff;
      color: #333;
      font-weight: 700;
      cursor: pointer;
    }
    .secondary:disabled { opacity: .45; cursor: not-allowed; }
    .preview-shell {
      position: relative;
      min-height: 280px;
      display: grid;
      place-items: center;
      overflow: hidden;
      border-radius: 14px;
      background: #eceef2;
      isolation: isolate;
      user-select: none;
    }
    #previewImage {
      display: block;
      max-width: 100%;
      max-height: 62vh;
      object-fit: contain;
      pointer-events: none;
      -webkit-user-drag: none;
    }
    .crop-selection {
      position: absolute;
      z-index: 1;
      display: none;
      border: 2px solid #fff;
      background-image:
        linear-gradient(to right, transparent calc(33.333% - .5px), rgba(255,255,255,.72) 33.333%, transparent calc(33.333% + .5px)),
        linear-gradient(to right, transparent calc(66.666% - .5px), rgba(255,255,255,.72) 66.666%, transparent calc(66.666% + .5px)),
        linear-gradient(to bottom, transparent calc(33.333% - .5px), rgba(255,255,255,.72) 33.333%, transparent calc(33.333% + .5px)),
        linear-gradient(to bottom, transparent calc(66.666% - .5px), rgba(255,255,255,.72) 66.666%, transparent calc(66.666% + .5px));
      box-shadow: 0 0 0 9999px rgba(10, 15, 24, .58), 0 0 0 1px rgba(0,0,0,.32);
      cursor: grab;
      touch-action: none;
    }
    .crop-selection::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 38px;
      height: 38px;
      border: 2px solid rgba(255,255,255,.92);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 1px 5px rgba(0,0,0,.32);
    }
    .crop-selection:focus-visible { outline: 3px solid #76a7ff; outline-offset: -3px; }
    .crop-selection.dragging { cursor: grabbing; }
    .crop-selection.locked { cursor: default; touch-action: auto; }
    .crop-selection.locked::after { display: none; }
    .crop-meta { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-top: 10px; }
    .crop-meta .info { min-width: 0; margin-top: 0; }
    .crop-info { flex: 0 0 auto; color: #2f6f4e; font-size: 13px; font-weight: 700; text-align: right; }
    .info { margin-top: 12px; font-size: 14px; color: #555; overflow-wrap: anywhere; }
    .settings h2 { margin: 0 0 14px; font-size: 20px; }
    .group { margin-bottom: 18px; }
    .group > label { display: block; margin-bottom: 7px; font-weight: 700; font-size: 14px; }
    .ratio-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
    .ratio-button {
      border: 1px solid #d5d8de; border-radius: 10px; padding: 9px 6px; background: #fff; cursor: pointer;
    }
    .ratio-button.active { border-color: #222; background: #222; color: #fff; }
    .custom-ratio {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: end;
      gap: 8px;
      margin-top: 10px;
    }
    .custom-ratio[hidden] { display: none; }
    .custom-ratio .separator { padding-bottom: 12px; color: #666; font-weight: 800; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .field label { display: block; margin-bottom: 5px; color: #555; font-size: 13px; }
    input[type="number"], select {
      width: 100%; min-height: 44px; padding: 9px 11px; border: 1px solid #ccd0d7; border-radius: 10px; background: #fff;
    }
    .hint { margin: 7px 0 0; color: #777; font-size: 12px; line-height: 1.5; }
    .primary, .download {
      width: 100%; border: 0; border-radius: 12px; padding: 13px 16px; font-weight: 800; cursor: pointer;
    }
    .primary { background: #222; color: #fff; }
    .primary:disabled { opacity: .45; cursor: not-allowed; }
    .result { display: none; margin-top: 14px; padding: 13px; border-radius: 12px; background: #f3f5f8; }
    .result strong { display: block; margin-bottom: 4px; }
    .preset-validation { display: grid; gap: 5px; margin: 10px 0 0; padding: 9px; border-radius: 9px; background: #fff; font-size: 12px; }
    .validation-item { display: flex; gap: 6px; align-items: flex-start; }
    .validation-item.ok { color: #25613f; }
    .validation-item.warning { color: #9b4f00; }
    .download { display: none; margin-top: 10px; background: #e6f3eb; color: #174b2d; text-decoration: none; text-align: center; }
    .status { min-height: 1.5em; margin-top: 10px; font-size: 13px; color: #666; }
    canvas { display: none; }
    @media (min-width: 760px) {
      .workspace { grid-template-columns: minmax(0, 1.35fr) minmax(300px, .65fr); align-items: start; }
      .settings { position: sticky; top: 16px; }
    }
    @media (max-width: 430px) {
      .ratio-grid { grid-template-columns: repeat(3, 1fr); }
      .app {
        padding-top: 16px;
        padding-right: max(12px, env(safe-area-inset-right));
        padding-left: max(12px, env(safe-area-inset-left));
      }
      .drop-area { margin-top: 18px; padding: 30px 12px; }
      .card { padding: 12px; border-radius: 16px; }
      .preview-heading { align-items: stretch; }
      .preview-heading .secondary { padding-inline: 10px; }
      .preview-shell { min-height: 200px; }
      .crop-meta { display: block; }
      .crop-info { margin-top: 5px; text-align: left; }
    }
  </style>
</head>
<body>
<div class="app">
  <h1>Image Fit Tool</h1>
  <p class="description">画像を投稿先に合わせて、比率・解像度・容量を整えるツール</p>
  <p class="privacy">画像処理はブラウザ内で行い、画像ファイルをサーバーへ送信しません。</p>

  <label class="drop-area" id="dropArea">
    <strong>画像をここにドロップ</strong><br>
    またはタップして画像を選択
    <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp,image/*">
  </label>

  <section class="workspace" id="workspace">
    <div class="card preview-card">
      <div class="preview-heading">
        <div>
          <h2>トリミング</h2>
          <p class="crop-help" id="cropHelp">アスペクト比を選ぶと切り抜き枠が表示されます。</p>
        </div>
        <button class="secondary" id="resetCropButton" type="button" disabled>中央に戻す</button>
      </div>
      <div class="group preset-group">
        <label for="purposePreset">用途プリセット</label>
        <select id="purposePreset">
          <option value="manual">手動で設定</option>
          <optgroup label="プロフィール画像">
            <option value="generic-profile">汎用プロフィール（1024 × 1024）</option>
            <option value="x-profile">X プロフィール（400 × 400）</option>
          </optgroup>
          <optgroup label="LINE 静止画スタンプ">
            <option value="line-sticker">スタンプ画像（370 × 320以内）</option>
            <option value="line-main">メイン画像（240 × 240）</option>
            <option value="line-tab">タブ画像（96 × 74）</option>
          </optgroup>
        </select>
        <p class="preset-note" id="presetNote">用途を選ぶと、比率・解像度・形式・容量目安をまとめて設定します。</p>
        <a class="preset-source" id="presetSource" href="#" target="_blank" rel="noreferrer" hidden>公式仕様を確認</a>
      </div>
      <div class="group crop-ratio-group">
        <label>アスペクト比</label>
        <div class="ratio-grid" id="ratioGrid">
          <button class="ratio-button active" data-ratio="original" type="button">元画像</button>
          <button class="ratio-button" data-ratio="1:1" type="button">1:1</button>
          <button class="ratio-button" data-ratio="4:3" type="button">4:3</button>
          <button class="ratio-button" data-ratio="3:4" type="button">3:4</button>
          <button class="ratio-button" data-ratio="3:2" type="button">3:2</button>
          <button class="ratio-button" data-ratio="2:3" type="button">2:3</button>
          <button class="ratio-button" data-ratio="16:9" type="button">16:9</button>
          <button class="ratio-button" data-ratio="9:16" type="button">9:16</button>
          <button class="ratio-button" data-ratio="custom" type="button">カスタム</button>
        </div>
        <div class="custom-ratio" id="customRatioFields" hidden>
          <div class="field">
            <label for="customRatioWidth">横</label>
            <input id="customRatioWidth" type="number" min="0.01" max="9999" step="0.01" inputmode="decimal" value="1">
          </div>
          <span class="separator" aria-hidden="true">:</span>
          <div class="field">
            <label for="customRatioHeight">縦</label>
            <input id="customRatioHeight" type="number" min="0.01" max="9999" step="0.01" inputmode="decimal" value="1">
          </div>
        </div>
        <p class="hint">比率を選び、白い枠を指やマウスで動かして位置を調整できます。</p>
      </div>
      <div class="preview-shell" id="previewShell">
        <img id="previewImage" alt="選択画像のプレビュー">
        <div class="crop-selection" id="cropSelection" role="application" aria-label="切り抜き範囲。ドラッグまたは矢印キーで移動できます。"></div>
      </div>
      <div class="crop-meta">
        <div class="info" id="imageInfo"></div>
        <div class="crop-info" id="cropInfo"></div>
      </div>
    </div>

    <div class="card settings">
      <h2>出力設定</h2>

      <div class="group">
        <label>出力解像度</label>
        <div class="field-row">
          <div class="field"><label for="widthInput">幅 (px)</label><input id="widthInput" type="number" min="1" max="12000"></div>
          <div class="field"><label for="heightInput">高さ (px)</label><input id="heightInput" type="number" min="1" max="12000"></div>
        </div>
        <p class="hint">アスペクト比を選ぶと高さを自動計算します。必要なら数値は直接変更できます。</p>
      </div>

      <div class="group">
        <label for="formatSelect">出力形式</label>
        <select id="formatSelect">
          <option value="image/jpeg">JPEG</option>
          <option value="image/webp">WebP</option>
          <option value="image/png">PNG</option>
        </select>
      </div>

      <div class="group">
        <label for="targetSizeInput">目標ファイルサイズ (MB)</label>
        <input id="targetSizeInput" type="number" min="0.05" max="100" step="0.05" value="2">
        <p class="hint">JPEG / WebP は容量以下になるよう画質を自動調整します。PNGは容量指定の対象外です。</p>
      </div>

      <button class="primary" id="processButton" type="button" disabled>画像を作成</button>
      <div class="status" id="status"></div>
      <div class="result" id="result" role="status" aria-live="polite"></div>
      <a class="download" id="downloadLink">画像を保存</a>
    </div>
  </section>

  <canvas id="canvas"></canvas>
</div>

<script>
  const dropArea = document.getElementById('dropArea');
  const fileInput = document.getElementById('fileInput');
  const workspace = document.getElementById('workspace');
  const previewShell = document.getElementById('previewShell');
  const previewImage = document.getElementById('previewImage');
  const cropSelection = document.getElementById('cropSelection');
  const cropHelp = document.getElementById('cropHelp');
  const cropInfo = document.getElementById('cropInfo');
  const resetCropButton = document.getElementById('resetCropButton');
  const imageInfo = document.getElementById('imageInfo');
  const purposePreset = document.getElementById('purposePreset');
  const presetNote = document.getElementById('presetNote');
  const presetSource = document.getElementById('presetSource');
  const ratioGrid = document.getElementById('ratioGrid');
  const customRatioFields = document.getElementById('customRatioFields');
  const customRatioWidth = document.getElementById('customRatioWidth');
  const customRatioHeight = document.getElementById('customRatioHeight');
  const widthInput = document.getElementById('widthInput');
  const heightInput = document.getElementById('heightInput');
  const formatSelect = document.getElementById('formatSelect');
  const targetSizeInput = document.getElementById('targetSizeInput');
  const processButton = document.getElementById('processButton');
  const status = document.getElementById('status');
  const result = document.getElementById('result');
  const downloadLink = document.getElementById('downloadLink');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  const LINE_GUIDELINE_URL = 'https://creator.line.me/en/guideline/sticker/';
  const X_PROFILE_GUIDELINE_URL = 'https://help.x.com/en/managing-your-account/common-issues-when-uploading-profile-photo';
  const PRESETS = {
    'generic-profile': {
      name: '汎用プロフィール',
      ratio: '1:1', width: 1024, height: 1024, mime: 'image/jpeg', targetMB: 2,
      exactSize: true,
      note: '丸型表示にも使いやすい汎用正方形です。主要部分を中央寄りに配置してください。'
    },
    'x-profile': {
      name: 'X プロフィール',
      ratio: '1:1', width: 400, height: 400, mime: 'image/jpeg', targetMB: 2,
      maxMB: 2, exactSize: true, source: X_PROFILE_GUIDELINE_URL,
      note: 'X公式の推奨400 × 400px、プロフィール画像の上限2MBに合わせます。'
    },
    'line-sticker': {
      name: 'LINE スタンプ画像',
      ratio: 'custom', ratioWidth: 37, ratioHeight: 32, width: 370, height: 320,
      mime: 'image/png', targetMB: 1, maxMB: 1, maxSize: true, requireEven: true, requireTransparency: true,
      source: LINE_GUIDELINE_URL,
      note: 'LINE静止画スタンプの上限370 × 320pxです。背景透過と、絵柄の周囲約10pxの余白も確認してください。'
    },
    'line-main': {
      name: 'LINE メイン画像',
      ratio: '1:1', width: 240, height: 240, mime: 'image/png', targetMB: 1,
      maxMB: 1, exactSize: true, requireEven: true, requireTransparency: true, source: LINE_GUIDELINE_URL,
      note: 'LINE静止画スタンプのメイン画像240 × 240pxです。背景透過が必要です。'
    },
    'line-tab': {
      name: 'LINE タブ画像',
      ratio: 'custom', ratioWidth: 48, ratioHeight: 37, width: 96, height: 74,
      mime: 'image/png', targetMB: 1, maxMB: 1, exactSize: true, requireEven: true, requireTransparency: true,
      source: LINE_GUIDELINE_URL,
      note: 'LINE静止画スタンプのトークルームタブ画像96 × 74pxです。背景透過が必要です。'
    }
  };

  let sourceFile = null;
  let sourceUrl = null;
  let selectedRatio = 'original';
  let customRatio = { width: 1, height: 1 };
  let activePresetKey = 'manual';
  let cropPosition = { x: .5, y: .5 };
  let dragState = null;
  let lastDownloadUrl = null;

  fileInput.addEventListener('change', () => {
    if (fileInput.files.length) loadImage(fileInput.files[0]);
  });

  ['dragenter', 'dragover'].forEach(type => dropArea.addEventListener(type, event => {
    event.preventDefault();
    dropArea.classList.add('dragover');
  }));

  ['dragleave', 'drop'].forEach(type => dropArea.addEventListener(type, event => {
    event.preventDefault();
    dropArea.classList.remove('dragover');
  }));

  dropArea.addEventListener('drop', event => {
    const file = event.dataTransfer.files[0];
    if (file) loadImage(file);
  });

  purposePreset.addEventListener('change', () => applyPreset(purposePreset.value));

  ratioGrid.addEventListener('click', event => {
    const button = event.target.closest('.ratio-button');
    if (!button) return;
    markSettingsCustomized();
    selectedRatio = button.dataset.ratio;
    updateRatioControls();
    resetCropPosition();
    syncOutputSize();
    updateCropUI();
    resetResult();
  });

  [customRatioWidth, customRatioHeight].forEach(input => input.addEventListener('input', () => {
    const width = Number(customRatioWidth.value);
    const height = Number(customRatioHeight.value);
    if (!(width > 0) || !(height > 0)) return;
    customRatio = { width, height };
    if (selectedRatio !== 'custom') return;
    markSettingsCustomized();
    resetCropPosition();
    syncOutputSize();
    updateCropUI();
    resetResult();
  }));

  widthInput.addEventListener('input', () => {
    markSettingsCustomized();
    const ratio = getNumericRatio();
    const width = Number(widthInput.value);
    if (ratio && width > 0) heightInput.value = Math.max(1, Math.round(width / ratio));
  });

  heightInput.addEventListener('input', () => {
    markSettingsCustomized();
    const ratio = getNumericRatio();
    const height = Number(heightInput.value);
    if (ratio && height > 0) widthInput.value = Math.max(1, Math.round(height * ratio));
  });

  formatSelect.addEventListener('change', () => {
    markSettingsCustomized();
    updateTargetSizeState();
  });

  targetSizeInput.addEventListener('input', markSettingsCustomized);

  processButton.addEventListener('click', processImage);
  resetCropButton.addEventListener('click', () => {
    resetCropPosition();
    updateCropUI();
    resetResult();
  });

  cropSelection.addEventListener('pointerdown', startCropDrag);
  cropSelection.addEventListener('pointermove', moveCropDrag);
  cropSelection.addEventListener('pointerup', endCropDrag);
  cropSelection.addEventListener('pointercancel', endCropDrag);
  cropSelection.addEventListener('keydown', moveCropWithKeyboard);
  window.addEventListener('resize', updateCropUI);

  if ('ResizeObserver' in window) {
    new ResizeObserver(updateCropUI).observe(previewShell);
  }

  function loadImage(file) {
    if (!file.type.startsWith('image/')) {
      alert('画像ファイルを選択してください');
      return;
    }

    sourceFile = file;
    if (sourceUrl) URL.revokeObjectURL(sourceUrl);
    sourceUrl = URL.createObjectURL(file);
    previewImage.src = sourceUrl;

    previewImage.onload = () => {
      const width = previewImage.naturalWidth;
      const height = previewImage.naturalHeight;
      imageInfo.textContent = `${file.name} / ${width} × ${height}px / ${formatBytes(file.size)} / ${file.type || '形式不明'}`;
      workspace.style.display = 'grid';
      processButton.disabled = false;
      if (activePresetKey !== 'manual') {
        applyPreset(activePresetKey);
      } else {
        selectedRatio = 'original';
        updateRatioControls();
        resetCropPosition();
        syncOutputSize();
        resetResult();
        requestAnimationFrame(updateCropUI);
      }
    };
  }

  function applyPreset(key) {
    const preset = PRESETS[key];
    activePresetKey = preset ? key : 'manual';
    purposePreset.value = activePresetKey;
    renderPresetInfo();
    if (!preset) return;

    if (preset.ratio === 'custom') {
      customRatio = { width: preset.ratioWidth, height: preset.ratioHeight };
    }
    selectedRatio = preset.ratio;
    updateRatioControls();
    widthInput.value = preset.width;
    heightInput.value = preset.height;
    formatSelect.value = preset.mime;
    targetSizeInput.value = preset.targetMB;
    updateTargetSizeState();
    resetCropPosition();
    resetResult();
    requestAnimationFrame(updateCropUI);
  }

  function markSettingsCustomized() {
    if (activePresetKey === 'manual') return;
    activePresetKey = 'manual';
    purposePreset.value = 'manual';
    renderPresetInfo();
  }

  function renderPresetInfo() {
    const preset = PRESETS[activePresetKey];
    if (!preset) {
      presetNote.textContent = '用途を選ぶと、比率・解像度・形式・容量目安をまとめて設定します。';
      presetSource.hidden = true;
      presetSource.removeAttribute('href');
      return;
    }
    presetNote.textContent = preset.note;
    if (preset.source) {
      presetSource.href = preset.source;
      presetSource.hidden = false;
    } else {
      presetSource.hidden = true;
      presetSource.removeAttribute('href');
    }
  }

  function updateRatioControls() {
    document.querySelectorAll('.ratio-button').forEach(btn => btn.classList.toggle('active', btn.dataset.ratio === selectedRatio));
    customRatioFields.hidden = selectedRatio !== 'custom';
    customRatioWidth.value = customRatio.width;
    customRatioHeight.value = customRatio.height;
  }

  function updateTargetSizeState() {
    targetSizeInput.disabled = formatSelect.value === 'image/png';
  }

  function getNumericRatio() {
    if (selectedRatio === 'original') {
      return previewImage.naturalWidth / previewImage.naturalHeight;
    }
    if (selectedRatio === 'custom') {
      return customRatio.width / customRatio.height;
    }
    const [w, h] = selectedRatio.split(':').map(Number);
    return w / h;
  }

  function syncOutputSize() {
    if (!sourceFile) return;
    const ratio = getNumericRatio();
    const sourceW = previewImage.naturalWidth;
    const sourceH = previewImage.naturalHeight;
    let cropW = sourceW;
    let cropH = sourceH;
    if (sourceW / sourceH > ratio) cropW = Math.round(sourceH * ratio);
    else cropH = Math.round(sourceW / ratio);
    widthInput.value = cropW;
    heightInput.value = cropH;
  }

  function getCropRect() {
    const sourceW = previewImage.naturalWidth;
    const sourceH = previewImage.naturalHeight;
    const ratio = getNumericRatio();
    let cropW = sourceW;
    let cropH = sourceH;
    if (sourceW / sourceH > ratio) cropW = sourceH * ratio;
    else cropH = sourceW / ratio;
    const maxX = Math.max(0, sourceW - cropW);
    const maxY = Math.max(0, sourceH - cropH);
    return {
      sx: maxX * clamp(cropPosition.x, 0, 1),
      sy: maxY * clamp(cropPosition.y, 0, 1),
      sw: cropW,
      sh: cropH
    };
  }

  function resetCropPosition() {
    cropPosition = { x: .5, y: .5 };
  }

  function updateCropUI() {
    if (!sourceFile || !previewImage.complete || !previewImage.naturalWidth) {
      cropSelection.style.display = 'none';
      cropInfo.textContent = '';
      return;
    }

    const shellRect = previewShell.getBoundingClientRect();
    const imageRect = previewImage.getBoundingClientRect();
    if (!imageRect.width || !imageRect.height) return;

    const crop = getCropRect();
    const scaleX = imageRect.width / previewImage.naturalWidth;
    const scaleY = imageRect.height / previewImage.naturalHeight;
    cropSelection.style.display = 'block';
    cropSelection.style.left = `${imageRect.left - shellRect.left + crop.sx * scaleX}px`;
    cropSelection.style.top = `${imageRect.top - shellRect.top + crop.sy * scaleY}px`;
    cropSelection.style.width = `${crop.sw * scaleX}px`;
    cropSelection.style.height = `${crop.sh * scaleY}px`;

    const movable = isCropMovable(crop);
    const centered = Math.abs(cropPosition.x - .5) < .001 && Math.abs(cropPosition.y - .5) < .001;
    cropSelection.classList.toggle('locked', !movable);
    cropSelection.tabIndex = movable ? 0 : -1;
    cropSelection.setAttribute('aria-disabled', String(!movable));
    resetCropButton.disabled = !movable || centered;
    cropHelp.textContent = movable
      ? '白い枠を指やマウスでドラッグして、残したい位置へ動かせます。'
      : '元画像全体を使用します。別のアスペクト比を選ぶと位置を調整できます。';
    cropInfo.textContent = `使用範囲 ${Math.round(crop.sw)} × ${Math.round(crop.sh)}px`;
  }

  function isCropMovable(crop = getCropRect()) {
    return previewImage.naturalWidth - crop.sw > .5 || previewImage.naturalHeight - crop.sh > .5;
  }

  function startCropDrag(event) {
    const crop = getCropRect();
    if (!isCropMovable(crop)) return;

    const imageRect = previewImage.getBoundingClientRect();
    if (!imageRect.width || !imageRect.height) return;
    event.preventDefault();
    dragState = {
      pointerId: event.pointerId,
      startX: event.clientX,
      startY: event.clientY,
      startSx: crop.sx,
      startSy: crop.sy,
      cropW: crop.sw,
      cropH: crop.sh,
      sourcePerPixelX: previewImage.naturalWidth / imageRect.width,
      sourcePerPixelY: previewImage.naturalHeight / imageRect.height
    };
    cropSelection.setPointerCapture(event.pointerId);
    cropSelection.classList.add('dragging');
  }

  function moveCropDrag(event) {
    if (!dragState || event.pointerId !== dragState.pointerId) return;
    event.preventDefault();
    const maxX = Math.max(0, previewImage.naturalWidth - dragState.cropW);
    const maxY = Math.max(0, previewImage.naturalHeight - dragState.cropH);
    const nextX = clamp(dragState.startSx + (event.clientX - dragState.startX) * dragState.sourcePerPixelX, 0, maxX);
    const nextY = clamp(dragState.startSy + (event.clientY - dragState.startY) * dragState.sourcePerPixelY, 0, maxY);
    cropPosition.x = maxX ? nextX / maxX : .5;
    cropPosition.y = maxY ? nextY / maxY : .5;
    updateCropUI();
    resetResult();
  }

  function endCropDrag(event) {
    if (!dragState || event.pointerId !== dragState.pointerId) return;
    if (cropSelection.hasPointerCapture(event.pointerId)) cropSelection.releasePointerCapture(event.pointerId);
    dragState = null;
    cropSelection.classList.remove('dragging');
  }

  function moveCropWithKeyboard(event) {
    const direction = {
      ArrowLeft: [-1, 0],
      ArrowRight: [1, 0],
      ArrowUp: [0, -1],
      ArrowDown: [0, 1]
    }[event.key];
    if (!direction || !isCropMovable()) return;
    event.preventDefault();
    const step = event.shiftKey ? .1 : .02;
    cropPosition.x = clamp(cropPosition.x + direction[0] * step, 0, 1);
    cropPosition.y = clamp(cropPosition.y + direction[1] * step, 0, 1);
    updateCropUI();
    resetResult();
  }

  function clamp(value, min, max) {
    return Math.min(max, Math.max(min, value));
  }

  async function processImage() {
    if (!sourceFile) return;
    const outW = Math.round(Number(widthInput.value));
    const outH = Math.round(Number(heightInput.value));
    if (!outW || !outH || outW < 1 || outH < 1 || outW > 12000 || outH > 12000) {
      alert('出力解像度は1〜12000pxの範囲で指定してください');
      return;
    }

    processButton.disabled = true;
    resetResult();
    status.textContent = '画像を処理しています…';

    try {
      canvas.width = outW;
      canvas.height = outH;
      ctx.clearRect(0, 0, outW, outH);
      const crop = getCropRect();
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(previewImage, crop.sx, crop.sy, crop.sw, crop.sh, 0, 0, outW, outH);

      const mime = formatSelect.value;
      let blob;
      let quality = 0.92;

      if (mime === 'image/png') {
        blob = await canvasToBlob(mime);
      } else {
        const targetBytes = Math.max(.05, Number(targetSizeInput.value) || 2) * 1024 * 1024;
        const encoded = await encodeUnderTarget(mime, targetBytes);
        blob = encoded.blob;
        quality = encoded.quality;
      }

      if (!blob) throw new Error('画像の生成に失敗しました');

      if (lastDownloadUrl) URL.revokeObjectURL(lastDownloadUrl);
      lastDownloadUrl = URL.createObjectURL(blob);
      downloadLink.href = lastDownloadUrl;
      downloadLink.download = makeFileName(sourceFile.name, mime);
      downloadLink.style.display = 'block';

      const qualityText = mime === 'image/png' ? 'PNG（画質指定なし）' : `品質 約${Math.round(quality * 100)}%`;
      const validationHtml = buildPresetValidation(blob, outW, outH, mime);
      result.innerHTML = `<strong>作成完了</strong>${outW} × ${outH}px / ${formatBytes(blob.size)}<br>${formatName(mime)} / ${qualityText}${validationHtml}`;
      result.style.display = 'block';
      status.textContent = '';
    } catch (error) {
      console.error(error);
      status.textContent = '処理に失敗しました。別の画像や小さい解像度でお試しください。';
    } finally {
      processButton.disabled = false;
    }
  }

  function buildPresetValidation(blob, outW, outH, mime) {
    const preset = PRESETS[activePresetKey];
    if (!preset) return '';

    const checks = [];
    const sizeOkay = preset.maxSize
      ? outW <= preset.width && outH <= preset.height
      : !preset.exactSize || (outW === preset.width && outH === preset.height);
    const sizeRule = preset.maxSize ? `${preset.width} × ${preset.height}px以内` : `${preset.width} × ${preset.height}px`;
    checks.push({ ok: sizeOkay, text: `寸法 ${outW} × ${outH}px（条件: ${sizeRule}）` });
    checks.push({ ok: mime === preset.mime, text: `形式 ${formatName(mime)}（条件: ${formatName(preset.mime)}）` });

    if (preset.maxMB) {
      checks.push({ ok: blob.size <= preset.maxMB * 1024 * 1024, text: `容量 ${formatBytes(blob.size)}（上限 ${preset.maxMB}MB）` });
    }
    if (preset.requireEven) {
      checks.push({ ok: outW % 2 === 0 && outH % 2 === 0, text: '幅・高さが偶数' });
    }
    if (preset.requireTransparency) {
      const transparency = canvasHasTransparency();
      checks.push({
        ok: transparency === true,
        text: transparency === true
          ? '透過背景を確認'
          : transparency === false
            ? '透過背景が見つかりません（LINEは背景透過必須）'
            : '透過背景を自動確認できませんでした'
      });
    }

    const rows = checks.map(check => `<div class="validation-item ${check.ok ? 'ok' : 'warning'}"><span aria-hidden="true">${check.ok ? '✓' : '⚠'}</span><span>${check.text}</span></div>`).join('');
    return `<div class="preset-validation"><b>${preset.name}の自動確認</b>${rows}</div>`;
  }

  function canvasHasTransparency() {
    try {
      const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
      for (let i = 3; i < data.length; i += 4) {
        if (data[i] < 255) return true;
      }
      return false;
    } catch (error) {
      console.warn('透過情報を確認できませんでした', error);
      return null;
    }
  }

  async function encodeUnderTarget(mime, targetBytes) {
    let low = 0.05;
    let high = 0.95;
    let best = null;
    let smallest = null;

    for (let i = 0; i < 9; i++) {
      const quality = (low + high) / 2;
      const blob = await canvasToBlob(mime, quality);
      if (!blob) throw new Error('エンコードに失敗しました');
      if (!smallest || blob.size < smallest.blob.size) smallest = { blob, quality };
      if (blob.size <= targetBytes) {
        best = { blob, quality };
        low = quality;
      } else {
        high = quality;
      }
    }
    return best || smallest;
  }

  function canvasToBlob(mime, quality) {
    return new Promise(resolve => canvas.toBlob(resolve, mime, quality));
  }

  function makeFileName(name, mime) {
    const base = name.replace(/\.[^.]+$/, '') || 'image';
    const ext = mime === 'image/jpeg' ? 'jpg' : mime === 'image/webp' ? 'webp' : 'png';
    return `${base}-fit.${ext}`;
  }

  function formatName(mime) {
    return mime === 'image/jpeg' ? 'JPEG' : mime === 'image/webp' ? 'WebP' : 'PNG';
  }

  function formatBytes(bytes) {
    if (bytes < 1024) return `${bytes} B`;
    if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
    return `${(bytes / 1024 / 1024).toFixed(2)} MB`;
  }

  function resetResult() {
    status.textContent = '';
    result.style.display = 'none';
    downloadLink.style.display = 'none';
  }
</script>
</body>
</html>
