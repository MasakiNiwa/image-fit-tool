<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Fit Tool</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #f5f5f7;
      color: #222;
    }

    .app {
      width: min(92%, 900px);
      margin: 0 auto;
      padding: 32px 0;
    }

    h1 {
      margin-bottom: 4px;
    }

    .description {
      margin-top: 0;
      color: #666;
    }

    .drop-area {
      margin-top: 24px;
      padding: 48px 20px;
      border: 2px dashed #999;
      border-radius: 18px;
      background: white;
      text-align: center;
      cursor: pointer;
    }

    .drop-area.dragover {
      background: #eef4ff;
      border-color: #3367d6;
    }

    input[type="file"] {
      display: none;
    }

    .preview {
      display: none;
      margin-top: 24px;
      padding: 16px;
      background: white;
      border-radius: 18px;
    }

    .preview img {
      display: block;
      max-width: 100%;
      max-height: 60vh;
      margin: auto;
      border-radius: 12px;
    }

    .info {
      margin-top: 12px;
      font-size: 14px;
      color: #555;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>Image Fit Tool</h1>

  <p class="description">
    画像を投稿先に合わせて、トリミング・縮小するツール
  </p>

  <label class="drop-area" id="dropArea">
    <strong>画像をここにドロップ</strong><br>
    またはタップして画像を選択

    <input
      type="file"
      id="fileInput"
      accept="image/*"
    >
  </label>

  <div class="preview" id="preview">
    <img id="previewImage">
    <div class="info" id="imageInfo"></div>
  </div>

</div>

<script>

const dropArea = document.getElementById("dropArea");
const fileInput = document.getElementById("fileInput");
const preview = document.getElementById("preview");
const previewImage = document.getElementById("previewImage");
const imageInfo = document.getElementById("imageInfo");

fileInput.addEventListener("change", () => {
  if (fileInput.files.length) {
    loadImage(fileInput.files[0]);
  }
});

dropArea.addEventListener("dragover", (event) => {
  event.preventDefault();
  dropArea.classList.add("dragover");
});

dropArea.addEventListener("dragleave", () => {
  dropArea.classList.remove("dragover");
});

dropArea.addEventListener("drop", (event) => {
  event.preventDefault();

  dropArea.classList.remove("dragover");

  const file = event.dataTransfer.files[0];

  if (file) {
    loadImage(file);
  }
});

function loadImage(file) {

  if (!file.type.startsWith("image/")) {
    alert("画像ファイルを選択してください");
    return;
  }

  const url = URL.createObjectURL(file);

  previewImage.onload = () => {

    const width = previewImage.naturalWidth;
    const height = previewImage.naturalHeight;

    const sizeMB =
      (file.size / 1024 / 1024).toFixed(2);

    imageInfo.textContent =
      `${width} × ${height}px / ${sizeMB}MB / ${file.type}`;

    preview.style.display = "block";
  };

  previewImage.src = url;
}

</script>

</body>
</html>
